<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEST XI - Football Formation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>⚽ BEST XI</h1>
    <p>선수 등록 → 포메이션 선택 → 베스트 일레븐 자동 구성</p>
  </div>
</header>

<main>
  <section class="panel">
    <div class="section-title">
      <h2>선수 관리</h2>
      <span id="playerCount">0명</span>
    </div>

    <div class="form-grid">
      <input id="playerName" type="text" placeholder="선수 이름" maxlength="20">
      <select id="mainPosition">
        <option value="">주 포지션 선택</option>
        <option value="GK">GK</option>
        <option value="LB">LB</option>
        <option value="CB">CB</option>
        <option value="RB">RB</option>
        <option value="DM">DM</option>
        <option value="CM">CM</option>
        <option value="AM">AM</option>
        <option value="LM">LM</option>
        <option value="RM">RM</option>
        <option value="LW">LW</option>
        <option value="RW">RW</option>
        <option value="ST">ST</option>
      </select>
    </div>

    <div class="label">뛸 수 있는 포지션</div>
    <div class="positions" id="positionChecks">
      <label><input type="checkbox" value="GK"> GK</label>
      <label><input type="checkbox" value="LB"> LB</label>
      <label><input type="checkbox" value="CB"> CB</label>
      <label><input type="checkbox" value="RB"> RB</label>
      <label><input type="checkbox" value="DM"> DM</label>
      <label><input type="checkbox" value="CM"> CM</label>
      <label><input type="checkbox" value="AM"> AM</label>
      <label><input type="checkbox" value="LM"> LM</label>
      <label><input type="checkbox" value="RM"> RM</label>
      <label><input type="checkbox" value="LW"> LW</label>
      <label><input type="checkbox" value="RW"> RW</label>
      <label><input type="checkbox" value="ST"> ST</label>
    </div>

    <button class="primary" id="addPlayer">선수 저장</button>
    <div id="playerList" class="player-list"></div>
  </section>

  <section class="panel tactics-panel">
    <div class="section-title">
      <h2>베스트 일레븐</h2>
      <button class="secondary" id="resetXI">초기화</button>
    </div>

    <div class="formation-row">
      <label for="formationSelect">포메이션</label>
      <select id="formationSelect">
        <option value="4-3-3">4-3-3</option>
        <option value="4-2-3-1">4-2-3-1</option>
        <option value="4-4-2">4-4-2</option>
        <option value="4-1-4-1">4-1-4-1</option>
        <option value="3-5-2">3-5-2</option>
        <option value="3-4-3">3-4-3</option>
        <option value="5-3-2">5-3-2</option>
      </select>
      <button class="primary" id="buildTeam">자동 베스트 XI</button>
    </div>

    <p class="hint">자동 구성 후 선수를 클릭하면 같은 포지션 후보 중에서 직접 교체할 수 있습니다. 선수는 드래그해서 위치도 바꿀 수 있습니다.</p>

    <div class="pitch-wrap">
      <div id="pitch">
        <div class="goal top-goal"></div>
        <div class="goal bottom-goal"></div>
        <div class="penalty top-penalty"></div>
        <div class="penalty bottom-penalty"></div>
        <div class="center-line"></div>
        <div class="center-circle"></div>
        <div class="center-dot"></div>
        <div id="playersOnPitch"></div>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">선수 선택</h3>
      <button id="closeModal" class="icon-button">×</button>
    </div>
    <div id="candidateList"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
